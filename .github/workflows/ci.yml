name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU-only PyTorch build first: the default Linux wheel pulls
          # several GB of CUDA libraries that CI never uses.
          TORCH_VERSION=$(grep -E '^torch==' requirements.txt | cut -d= -f3)
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e . --no-deps

      # Chunking tests download the embedding model's tokenizer; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('src/rag/config.py') }}

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest
