[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-renting-rag"
version = "1.0.1"
description = "RAG question-answering assistant over UK GOV.UK renting and tenancy guidance."
requires-python = ">=3.11"

# Dependencies are pinned in requirements.txt; the package itself is installed with
# `pip install -e .` so that scripts and tests can `import rag`.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes errors, I: import sorting, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["rag", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `import rag` (src layout) and `import app` work without installing anything
pythonpath = ["src", "."]
addopts = "-ra"
